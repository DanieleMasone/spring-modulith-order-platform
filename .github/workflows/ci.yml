name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven Verify
        run: ./mvnw -B -ntp clean verify

      - name: Verify Generated Artifacts
        run: |
          test -f target/site/jacoco/index.html
          test -f target/generated-docs/openapi/index.html
          test -f target/generated-docs/openapi/openapi.json
          test -f target/pages/index.html
          test -f target/pages/jacoco/index.html
          test -f target/pages/openapi/index.html
          test -f target/pages/openapi/openapi.json

      - name: Docker Compose Validation
        run: docker compose config

      - name: Docker Image Build
        run: docker build -t spring-modulith-order-platform:${{ github.sha }} .

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/pages

  deploy:
    name: Deploy Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
