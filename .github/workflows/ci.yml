name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'pages' || format('ci-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven Verify
        run: ./mvnw -B -ntp clean verify

      - name: Verify Generated Artifacts
        run: |
          test -f target/pages/index.html
          test -f target/pages/assets/site.css
          test -f target/pages/assets/reports.css
          test -f target/pages/assets/site.js
          test -f target/pages/user-guide/index.html
          test -f target/pages/jacoco/index.html
          test -f target/pages/javadoc/index.html
          test -f target/pages/openapi/index.html
          test -f target/pages/openapi/openapi.json

      - name: Docker Compose Validation
        run: docker compose config

      - name: Docker Image Build
        run: docker build -t spring-modulith-order-platform:${{ github.sha }} .

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/pages

  deploy:
    name: Deploy Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
