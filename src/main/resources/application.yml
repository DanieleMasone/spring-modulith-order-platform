spring:
  application:
    name: order-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/order_platform
    username: order_platform
    password: order_platform
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      completion-mode: DELETE
      jdbc:
        schema-initialization:
          enabled: false

server:
  error:
    include-message: never
    include-binding-errors: never

logging:
  level:
    org.springframework.modulith: INFO
