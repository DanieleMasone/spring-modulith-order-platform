services:
  postgres:
    image: postgres:17-alpine
    container_name: order-platform-postgres
    environment:
      POSTGRES_DB: order_platform
      POSTGRES_USER: order_platform
      POSTGRES_PASSWORD: order_platform
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_platform -d order_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - order-platform-postgres-data:/var/lib/postgresql/data

volumes:
  order-platform-postgres-data:
